<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6f3"><meta name="description" content="Local knowledge."><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self'; img-src 'self' data:; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./blank-paper.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>BabelShelf</title></head>
<body><div class="shell">

<main><header class="top"><h1 id="page-title">BabelShelf</h1><button id="open-settings" class="settings-button" aria-label="Settings">Settings</button><div class="top-badges"><span class="pill" id="connection">Local</span><span class="pill muted" id="model-badge">Not loaded</span></div></header><div id="notice" class="notice" role="status" hidden></div>
<section id="view-ask" class="view"><div id="ask-result" class="chat-thread" role="log" aria-label="Results"></div><div class="composer-dock"><form id="chat-form" class="ask-card"><label class="sr" for="question">Input</label><textarea id="question" placeholder="Write…" rows="2"></textarea><div class="ask-actions"><button id="ask-submit" class="primary" type="submit">Send</button><button id="stop-generation" class="secondary" type="button" hidden>Stop</button></div></form><div id="ask-status" class="status-line" aria-live="polite"></div></div></section>
<section id="view-notes" class="view" hidden><div class="section-heading"><h2>Markdown <span id="note-count" class="count">0</span></h2><button class="primary" id="new-note">New file</button></div><div class="workspace"><section class="file-browser" aria-label="Markdown files"><label class="searchbox"><input id="search" type="search" placeholder="Filter files…" aria-label="Search notes"></label><div class="list-tools"><span id="list-label">All</span><label><input type="checkbox" id="show-withdrawn"> Withdrawn</label></div><div id="note-list" class="note-list"></div><button class="text-button import-trigger">Import</button></section><section class="editor" id="note-editor" aria-label="Note"><button id="back-to-list" class="secondary mobile-back">Back</button><div id="editor-empty" class="empty"><button class="secondary" id="empty-new">New file</button></div><div id="editor-content" hidden><div class="editor-meta"><span id="editor-kind" class="tag">Original</span><span id="save-status" aria-live="polite">Saved</span></div><div id="note-reading" class="reading"><div id="reading-path" class="small"></div><h2 id="reading-title"></h2><div id="reading-body"></div></div><div id="edit-controls" class="button-row"><button id="edit-note" class="secondary">Edit</button><button id="finish-edit" class="primary" hidden>Save revision</button></div><div id="edit-fields" hidden><label class="sr" for="note-title">Title</label><input id="note-title" class="title-input" placeholder="Title"><label class="sr" for="note-body">Note</label><textarea id="note-body" placeholder="Write…" spellcheck="false"></textarea><label class="path-label">Path<input id="note-path" spellcheck="false" placeholder="inbox/file.md"></label><label class="aliases">Aliases<input id="note-aliases" placeholder="Aliases"></label></div><div id="note-relations" class="relations"></div><footer class="editor-footer"><span id="editor-detail"></span><div><details class="note-more"><summary>More</summary><button class="text-button" id="export-markdown">Export Markdown</button><button class="text-button" id="history">History</button><button class="text-button" id="summarize-note">Summarize</button><button class="text-button danger" id="withdraw-note">Withdraw</button></details></div></footer></div></section></div></section>
<section id="view-manage" class="view" hidden><div class="settings-grid"><section class="settings-card"><h3>Connection</h3><label class="toggle-row"><span>Downloads &amp; updates</span><input type="checkbox" role="switch" id="network-toggle" aria-label="Downloads and updates"></label></section><section class="settings-card model-card"><h3>Bonsai 2</h3><label class="field-label"><span class="sr">Model</span><select id="model-select"><option value="4B">Bonsai 2 · 4B</option><option value="2B">Bonsai 2 · 2B</option></select></label><div id="model-size" class="small"></div><div id="asset-status" class="status-box">Checking…</div><div class="button-row"><button id="prepare-model" class="primary">Download</button><button id="load-model" class="secondary" hidden>Load</button></div><details class="advanced-model"><summary>More</summary><button id="unload-model" class="text-button">Unload</button><button id="cancel-model" class="text-button">Stop</button><button id="local-model" class="text-button">Import model</button><input id="model-files" type="file" multiple accept=".gguf,.js" hidden></details><div id="model-progress" class="small" role="status"></div></section><details class="settings-card backup-panel"><summary>Backup</summary><div class="button-row"><button id="export-backup" class="secondary">Export backup</button><button id="restore-backup" class="text-button">Restore</button><button class="text-button import-trigger">Import notes</button><button id="persist-storage" class="text-button" hidden>Keep storage</button></div><div id="storage-status" class="small"></div></details><details class="settings-card diagnostics-panel"><summary>Diagnostics</summary><div class="button-row"><button id="probe-gpu" class="secondary">GPU</button><button id="run-diagnostics" class="secondary">Storage &amp; search</button><button id="run-model-test" class="secondary">Generation</button><button id="run-language-suite" class="secondary">Languages</button><button id="rebuild-index" class="text-button">Reindex</button><button id="cold-start" class="text-button">Cold start</button><button id="export-diagnostics" class="text-button">Export results</button></div><div id="diagnostic-results" class="diagnostic-results"></div><div id="build-status" class="small"></div><div id="pwa-status" class="small"></div><button id="update-app" class="text-button">Check for updates</button></details></div><footer class="document-links"><a href="./README.txt" target="_blank" rel="noopener">Readme</a><a href="./model-manifest.json" target="_blank" rel="noopener">Manifest</a><a href="./LICENSES.txt" target="_blank" rel="noopener">Licenses</a></footer></section>
</main><nav class="bottom-toggle" aria-label="View"><button class="active" data-view="ask" aria-pressed="true">Input</button><button data-view="notes" aria-pressed="false">Markdown</button></nav></div><input id="import-files" type="file" multiple accept=".txt,.md,.markdown,text/plain,text/markdown" hidden><input id="restore-file" type="file" accept=".brainpack,.json" hidden><dialog id="modal"><div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" class="text-button" aria-label="Close">Close</button></div><div id="modal-body"></div><div id="modal-actions" class="button-row"></div></dialog><script type="module" src="./app.js"></script></body></html>
