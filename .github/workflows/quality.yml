name: Local PWA quality

on:
  push:
    branches: [codex/ui-design-handoff]
    # Evidence-only updates must not cancel an in-flight code verification.
    # Keep PR checks unfiltered; SKILL.md and other packaged Markdown still run.
    paths-ignore:
      - docs/REMAINING-GATES.md
      - docs/TEST-RESULTS.txt
  pull_request:
    branches: [codex/ui-design-handoff]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-quality:
    # Pin the OS family while ubuntu-latest transitions from 24.04 to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            design/prototype/package-lock.json
      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.22.2"
          test "$(npm --version)" = "11.19.1"
      - name: Install pinned dependencies
        # This PWA CI exercises browser inference only; the Node CUDA EP is unused.
        # Avoid the upstream postinstall's network fetch from NuGet.
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
        run: npm ci --prefix design/prototype
      - name: Install root test dependencies
        run: npm ci
      - name: Install browser system dependencies
        run: npm --prefix design/prototype exec -- playwright install-deps chromium webkit
      - name: Install pinned Chromium and WebKit
        run: npm --prefix design/prototype exec -- playwright install chromium webkit
      - name: App update protocol acceptance
        # This fixture uses production source and synthetic assets, not a build.
        # Fail early on update integrity before the longer UI acceptance suite.
        run: npm run test:quality:app-update
      - name: Build prototype packaging fixtures
        run: npm run build:prototype
      - name: Core tests, static checks, production build and acceptance
        run: |
          npm test
          npm run test:prototype
          npm run check
          npm run build:app
          npm run test:app
          npm run test:editor:built
      - name: Review store and offline calculation
        run: |
          npm run test:quality:review-store
          npm run test:quality:offline-calculation
      - name: Tool, MCP, help and Markdown acceptance
        run: |
          npm run test:help:built
          npm run test:tools:built
          npm run test:markdown
          npm run test:quality:hash
          npm run test:quality:custom-tools
          npm run test:quality:mcp
          npm run test:quality:mcp:webkit
      - name: Device memory, inference, schedule and settings acceptance
        run: |
          npm run test:quality:device-memory
          npm run test:quality:inference-lock
          npm run test:quality:schedule-ui
          npm run test:quality:settings-ui
      - name: Editorial and iOS handoff acceptance
        run: |
          npm run test:quality:editorial
          npm run test:ios-handoff:built
          npm run test:ios-handoff:webkit:built
      - name: Offline and installed PWA acceptance
        run: |
          npm run test:quality:offline
          npm run test:quality:installed-pwa
