name: Local PWA quality

on:
  push:
    branches: [codex/ui-design-handoff]
  pull_request:
    branches: [codex/ui-design-handoff]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-quality:
    # Pin the OS family while ubuntu-latest transitions from 24.04 to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            design/prototype/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --prefix design/prototype
      - name: Install root test dependencies
        run: npm ci
      - name: Install Chromium and WebKit for real browser checks
        run: npm --prefix design/prototype exec -- playwright install --with-deps chromium webkit
      - name: Build prototype packaging fixtures
        run: npm run build:prototype
      - name: Core tests, static checks, production build and acceptance
        run: |
          npm test
          npm run test:prototype
          npm run check
          npm run build:app
          npm run test:app
          npm run test:editor:built
      - name: Review store and offline calculation
        run: |
          npm run test:quality:review-store
          npm run test:quality:offline-calculation
      - name: Tool, MCP, help and Markdown acceptance
        run: |
          npm run test:help:built
          npm run test:tools:built
          npm run test:markdown
          npm run test:quality:hash
          npm run test:quality:custom-tools
          npm run test:quality:mcp
          npm run test:quality:mcp:webkit
      - name: Device memory, inference, schedule and settings acceptance
        run: |
          npm run test:quality:device-memory
          npm run test:quality:inference-lock
          npm run test:quality:schedule-ui
          npm run test:quality:settings-ui
      - name: Editorial and iOS handoff acceptance
        run: |
          npm run test:quality:editorial
          npm run test:ios-handoff:built
          npm run test:ios-handoff:webkit:built
      - name: App update, offline and installed PWA acceptance
        run: |
          npm run test:quality:app-update
          npm run test:quality:offline
          npm run test:quality:installed-pwa
