<!doctype html>
<html><head><meta charset="UTF-8"><title>Streaming SHA-256 fixture</title></head>
<body><script type="module">
import '../src/fast-hash.ts';
import {createStreamingSHA256,streamingSHA256Backend} from '../../../dist/streaming-sha256.js';
window.runHash=async()=>{const hash=await createStreamingSHA256();hash.update(new TextEncoder().encode('abc'));return {digest:hash.hex(),backend:streamingSHA256Backend()};};
window.runWorkerHash=()=>new Promise((resolve,reject)=>{const worker=new Worker(new URL('./fast-hash-worker.ts',import.meta.url),{type:'module'});const timer=setTimeout(()=>{worker.terminate();reject(Error('SHA-256 worker timed out'));},5000);worker.onmessage=event=>{clearTimeout(timer);worker.terminate();resolve(event.data);};worker.onerror=event=>{clearTimeout(timer);worker.terminate();reject(Error(event.message));};worker.postMessage('abc');});
</script></body></html>
